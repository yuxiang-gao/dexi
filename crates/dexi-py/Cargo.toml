[package]
name = "dexi-rs"
version = "0.2.0"
edition = "2021"
description = "Python bindings for dexi via PyO3"
license = "MIT"
repository = "https://github.com/yuxiang-gao/dexi"
homepage = "https://github.com/yuxiang-gao/dexi"
documentation = "https://github.com/yuxiang-gao/dexi/tree/main/docs"

[lib]
name = "dexi_rs"
crate-type = ["cdylib"]

[dependencies]
dexi = { path = "../dexi" }
nalgebra = { workspace = true }
pyo3 = { version = "0.28", features = ["extension-module"] }
