[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dexi-rs"
dynamic = ["version"]
description = "Fast Rust hand retargeting with Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dexi contributors" }]
keywords = ["robotics", "retargeting", "hand", "rust", "pyo3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://pypi.org/project/dexi-rs/"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "dexi_rs._native"
include = [
  { path = "LICENSE", format = "wheel" },
  { path = "THIRD_PARTY_NOTICES.md", format = "wheel" },
  { path = "LICENSE", format = "sdist" },
  { path = "THIRD_PARTY_NOTICES.md", format = "sdist" },
  { path = "python/dexi_rs/resources/assets/**/*", format = "wheel" },
  { path = "python/dexi_rs/resources/assets/**/*", format = "sdist" },
  { path = "python/dexi_rs/_native.pyi", format = "wheel" },
  { path = "python/dexi_rs/py.typed", format = "wheel" },
  { path = "python/dexi_rs/_native.pyi", format = "sdist" },
  { path = "python/dexi_rs/py.typed", format = "sdist" },
]
