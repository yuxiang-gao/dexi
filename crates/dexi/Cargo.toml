[package]
name = "dexi"
version = "0.4.0"
edition = "2021"
description = "Pure Rust hand retargeting library"
license = "MIT"
repository = "https://github.com/yuxiang-gao/dexi"
homepage = "https://github.com/yuxiang-gao/dexi"
documentation = "https://github.com/yuxiang-gao/dexi/tree/main/docs"

[dependencies]
nalgebra = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
slsqp = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[[test]]
name = "test_config_parsing"
path = "tests/test_config_parsing.rs"

[[test]]
name = "test_optimizer"
path = "tests/test_optimizer.rs"

[[test]]
name = "test_python_comparison"
path = "tests/test_python_comparison.rs"
